name: Daily News Update

# 毎朝の定期実行は、手元のマシン（Mac mini / DGX Spark）の scripts/run_local.sh に移しました。
# このワークフローは「手動で回したいとき」用です。
# 使う場合は Secrets に LLM_BASE_URL / LLM_MODEL / LLM_API_KEY を登録してください
# （GitHubから届くOpenAI互換APIのURLが必要です）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ddgs

      - name: Update news data
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/update_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "ride-the-world-bot"
          git config user.email "actions@github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🚲 Daily news update ($(TZ=Asia/Tokyo date +%Y.%m.%d))"
            git push
          fi
